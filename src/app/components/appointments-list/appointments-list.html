<p-table
  [value]="appointments()"
>
  <ng-template #header>
    <tr>
      <th>Datum</th>
      <th>Zeit</th>
      <th>Therapie</th>
      <th>Dauer (Minuten)</th>
      <th>Preis (CHF)</th>
    </tr>
  </ng-template>
  <ng-template #body let-appointment>
    <tr>
      <td>{{ appointment.appointmentTimestamp | date:'dd.MM.yyyy' }}</td>
      <td>{{ appointment.appointmentTimestamp | date:'HH:mm' }}</td>
      <td>{{ appointment.therapy.name }}</td>
      <td>{{ appointment.therapy.duration }}</td>
      <td>{{ appointment.therapy.price | number:'1.2-2' }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="text-center py-8 text-content/50">Keine Termine gefunden.</td>
    </tr>
  </ng-template>
</p-table>
