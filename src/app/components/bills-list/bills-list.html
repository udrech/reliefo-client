<p-table [value]="bills()">
  <ng-template #header>
    <tr>
      <th>Erstellt</th>
    </tr>
  </ng-template>
  <ng-template #body let-bill>
    <tr>
      <td>{{ bill.createdAt | date:'dd.MM.yyyy' }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="2" class="text-center py-8 text-content/50">Keine Rechnungen gefunden.</td>
    </tr>
  </ng-template>
</p-table>
