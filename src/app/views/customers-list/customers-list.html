<div class="flex justify-end mb-4">
  <p-button routerLink="/kunden/neu" ariaLabel="Neuen Kunden erfassen">
    <span class="material-symbols-outlined text-xl" aria-hidden="true">add</span>
    <span>Neuer Kunde</span>
  </p-button>
</div>

<p-table
  [value]="customers()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="lastName">Nachname <p-sortIcon field="lastName" /></th>
      <th pSortableColumn="firstName">Vorname <p-sortIcon field="firstName" /></th>
      <th pSortableColumn="city">Ort <p-sortIcon field="city" /></th>
      <th pSortableColumn="zipCode">PLZ <p-sortIcon field="zipCode" /></th>
      <th>Adresse</th>
      <th>E-Mail</th>
      <th>Telefon</th>
      <th>Mobil</th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-customer>
    <tr>
      <td>{{ customer.lastName }}</td>
      <td>{{ customer.firstName }}</td>
      <td>{{ customer.city }}</td>
      <td>{{ customer.zipCode }}</td>
      <td>{{ customer.address }}</td>
      <td>{{ customer.email }}</td>
      <td>{{ customer.phone }}</td>
      <td>{{ customer.mobile }}</td>
      <td class="w-10">
        <p-button [text]="true" [rounded]="true" severity="secondary" [routerLink]="['/kunden', customer.id]" ariaLabel="Kunde bearbeiten" pTooltip="Bearbeiten" tooltipPosition="top">
          <span class="material-symbols-outlined text-xl" aria-hidden="true">edit</span>
        </p-button>
      </td>
      <td class="w-10">
        <p-button [text]="true" [rounded]="true" severity="danger" (onClick)="deleteCustomer(customer.id)" ariaLabel="Kunde löschen" pTooltip="Löschen" tooltipPosition="top">
          <span class="material-symbols-outlined text-xl" aria-hidden="true">delete</span>
        </p-button>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="10" class="text-center py-8 text-content/50">Keine Kunden gefunden.</td>
    </tr>
  </ng-template>
</p-table>
