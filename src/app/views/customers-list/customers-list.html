<div class="flex justify-end mb-4">
  <a
    routerLink="/kunden/neu"
    class="flex items-center gap-2 px-4 py-2 bg-primary-500 text-white rounded hover:bg-primary-600 transition-colors"
    aria-label="Neuen Kunden erfassen"
  >
    <span class="material-symbols-outlined text-xl" aria-hidden="true">add</span>
    <span>Neuer Kunde</span>
  </a>
</div>

<p-table
  [value]="customers()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="lastName">Nachname <p-sortIcon field="lastName" /></th>
      <th pSortableColumn="firstName">Vorname <p-sortIcon field="firstName" /></th>
      <th pSortableColumn="city">Ort <p-sortIcon field="city" /></th>
      <th pSortableColumn="zipCode">PLZ <p-sortIcon field="zipCode" /></th>
      <th>Adresse</th>
      <th>E-Mail</th>
      <th>Telefon</th>
      <th>Mobil</th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-customer>
    <tr>
      <td>{{ customer.lastName }}</td>
      <td>{{ customer.firstName }}</td>
      <td>{{ customer.city }}</td>
      <td>{{ customer.zipCode }}</td>
      <td>{{ customer.address }}</td>
      <td>{{ customer.email }}</td>
      <td>{{ customer.phone }}</td>
      <td>{{ customer.mobile }}</td>
      <td class="w-10">
        <button
          type="button"
          class="p-2 rounded-full hover:bg-surface-100 text-content/70 hover:text-primary-500 transition-colors"
          [routerLink]="['/kunden', customer.id]"
          aria-label="Kunde bearbeiten"
        >
          <span class="material-symbols-outlined text-xl" aria-hidden="true">edit</span>
        </button>
      </td>
      <td class="w-10">
        <button
          type="button"
          class="p-2 rounded-full hover:bg-surface-100 text-content/70 hover:text-red-500 transition-colors"
          (click)="deleteCustomer(customer.id)"
          aria-label="Kunde löschen"
        >
          <span class="material-symbols-outlined text-xl" aria-hidden="true">delete</span>
        </button>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="10" class="text-center py-8 text-content/50">Keine Kunden gefunden.</td>
    </tr>
  </ng-template>
</p-table>
