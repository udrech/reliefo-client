<p-table
  [value]="bills()"
>
  <ng-template #header>
    <tr>
      <th>Quittung-Nr.</th>
      <th>Kunde</th>
      <th>Erstellt</th>
      <th><!-- Download --></th>
      <th><!-- Löschen --></th>
    </tr>
  </ng-template>
  <ng-template #body let-bill>
    <tr>
      <td><a [routerLink]="['/quittungen', bill.id]" class="font-bold">{{ bill.billNumber }}</a></td>
      <td><a [routerLink]="['/kunden', bill.customer.id]" class="font-bold">{{ bill.customer.lastName }} {{ bill.customer.firstName }}</a></td>
      <td>{{ bill.createdAt | date:'dd.MM.yyyy HH:mm' }}</td>
      <td class="w-10">
        <p-button [text]="true" (onClick)="downloadBill(bill)" ariaLabel="Quittung herunterladen" pTooltip="Herunterladen" tooltipPosition="top">
          <span class="material-symbols-outlined text-xl" aria-hidden="true">download</span>
        </p-button>
      </td>
      <td class="w-10">
        <p-button [text]="true" severity="danger" (onClick)="deleteBill(bill.id)" ariaLabel="Quittung löschen" pTooltip="Löschen" tooltipPosition="top">
          <span class="material-symbols-outlined text-xl" aria-hidden="true">delete</span>
        </p-button>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="text-center py-8 text-content/50">Keine Quittungen gefunden.</td>
    </tr>
  </ng-template>
</p-table>
