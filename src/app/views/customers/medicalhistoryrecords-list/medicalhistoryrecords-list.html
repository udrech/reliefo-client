<div class="flex justify-end p-3 gap-2 bg-white">
  <p-button [routerLink]="['/kunden', store.customerId(), 'krankengeschichte', 'neu']" ariaLabel="Neuen Eintrag erfassen">
    <span class="material-symbols-outlined text-xl" aria-hidden="true">add</span>
    <span>Neuer Eintrag</span>
  </p-button>
</div>

<p-table [value]="records()">
  <ng-template #header>
    <tr>
      <th>Datum</th>
      <th>Uhrzeit</th>
      <th>Typ</th>
      <th>Notiz</th>
      <th><!-- Bearbeiten --></th>
      <th><!-- Löschen --></th>
    </tr>
  </ng-template>
  <ng-template #body let-record>
    <tr>
      <td>{{ record.historyTimestamp | date:'dd.MM.yyyy' }}</td>
      <td>{{ record.historyTimestamp | date:'HH:mm' }}</td>
      <td>{{ record.historyType }}</td>
      <td>{{ record.note }}</td>
      <td class="w-10">
        <p-button [text]="true" severity="secondary" [routerLink]="['/kunden', store.customerId(), 'krankengeschichte', record.id, 'bearbeiten']" ariaLabel="Eintrag bearbeiten" pTooltip="Bearbeiten" tooltipPosition="top">
          <span class="material-symbols-outlined text-xl" aria-hidden="true">edit</span>
        </p-button>
      </td>
      <td class="w-10">
        <p-button [text]="true" severity="danger" (onClick)="delete(record.id)" ariaLabel="Eintrag löschen" pTooltip="Löschen" tooltipPosition="top">
          <span class="material-symbols-outlined text-xl" aria-hidden="true">delete</span>
        </p-button>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="6" class="text-center py-8 text-content/50">Keine Einträge gefunden.</td>
    </tr>
  </ng-template>
</p-table>
