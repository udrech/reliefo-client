<div class="p-5">
  <h1 class="text-3xl font-bold mb-6">Statistiken</h1>

  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0">Massagen pro Kunde (aktuelles Jahr)</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0">
        <div class="flex justify-center py-4">
          <!-- appointment count per customer in the current year -->
          <div style="position: relative; height: 400px; width: 600px;">
            <p-chart
              type="doughnut"
              [data]="chartData()"
              [options]="chartOptions"
              width="600"
              height="400"
            />
          </div>
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
