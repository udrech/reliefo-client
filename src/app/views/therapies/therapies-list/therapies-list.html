<div class="flex justify-end mb-4">
  <p-button routerLink="/massagen/neu" ariaLabel="Neue Massage erfassen">
    <span class="material-symbols-outlined text-xl" aria-hidden="true">add</span>
    <span>Neue Massage</span>
  </p-button>
</div>

<p-table
  [value]="therapies()"
>
  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>Massage ID</th>
      <th>Bezeichnung</th>
      <th>Bezeichnung auf Quittung</th>
      <th>Beschreibung</th>
      <th>Dauer (Minuten)</th>
      <th>Preis (CHF)</th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-therapy>
    <tr>
      <td>{{ therapy.id }}</td>
      <td>{{ therapy.therapyId }}</td>
      <td>{{ therapy.name }}</td>
      <td>{{ therapy.nameOnBill }}</td>
      <td>{{ therapy.description }}</td>
      <td>{{ therapy.duration }}</td>
      <td>{{ therapy.price }}</td>
      <td class="w-10">
        <p-button [text]="true" severity="secondary" [routerLink]="['/massagen', therapy.id, 'bearbeiten']" ariaLabel="Massage bearbeiten" pTooltip="Bearbeiten" tooltipPosition="top">
          <span class="material-symbols-outlined text-xl" aria-hidden="true">edit</span>
        </p-button>
      </td>
      <td class="w-10">
        <p-button [text]="true" severity="danger" (onClick)="deleteTherapy(therapy.id)" ariaLabel="Massage löschen" pTooltip="Löschen" tooltipPosition="top">
          <span class="material-symbols-outlined text-xl" aria-hidden="true">delete</span>
        </p-button>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="10" class="text-center py-8 text-content/50">Keine Massagen gefunden.</td>
    </tr>
  </ng-template>
</p-table>
