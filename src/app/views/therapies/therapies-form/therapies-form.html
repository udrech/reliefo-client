<div class="p-5 bg-white">
  <form [formGroup]="form" (ngSubmit)="save()" class="max-w-2xl">
    <h2 class="text-xl font-semibold mb-6">{{ isNew() ? 'Neue Massage' : 'Massage bearbeiten' }}</h2>

    <div class="grid gap-y-4">
      <div class="grid grid-cols-[200px_1fr] items-center gap-x-4">
        <label for="name" class="text-right font-medium">
          Bezeichnung <span aria-hidden="true">*</span>
        </label>
        <input pInputText id="name" formControlName="name" class="w-full" />
      </div>

      <div class="grid grid-cols-[200px_1fr] items-center gap-x-4">
        <label for="nameOnBill" class="text-right font-medium">
          Bezeichnung auf Quittung <span aria-hidden="true">*</span>
        </label>
        <input pInputText id="nameOnBill" formControlName="nameOnBill" class="w-full" />
      </div>

      <div class="grid grid-cols-[200px_1fr] items-center gap-x-4">
        <label for="description" class="text-right font-medium">Beschreibung</label>
        <input pInputText id="description" formControlName="description" class="w-full" />
      </div>

      <div class="grid grid-cols-[200px_1fr] items-center gap-x-4">
        <label for="duration" class="text-right font-medium">Dauer (Minuten)</label>
        <input pInputText id="duration" formControlName="duration" class="w-full" />
      </div>

      <div class="grid grid-cols-[200px_1fr] items-center gap-x-4">
        <label for="price" class="text-right font-medium">Preis (CHF)</label>
        <input pInputText id="price" formControlName="price" class="w-full" />
      </div>

      <div class="grid grid-cols-[200px_1fr] items-center gap-x-4">
        <label for="validFrom" class="text-right font-medium">
          Gültig von <span aria-hidden="true">*</span>
        </label>
        <div class="flex items-center gap-1" formGroupName="validFrom">
          <input
            pInputText
            id="validFrom"
            formControlName="day"
            pKeyFilter="pint"
            inputmode="numeric"
            autocomplete="off"
            maxlength="2"
            class="w-12 text-center"
            placeholder="tt"
            (input)="focusNextOnFilled($event, validFromMonthInput)"
          />
          <span>.</span>
          <input
            #validFromMonthInput
            pInputText
            formControlName="month"
            pKeyFilter="pint"
            inputmode="numeric"
            autocomplete="off"
            maxlength="2"
            class="w-12 text-center"
            placeholder="mm"
            (input)="focusNextOnFilled($event, validFromYearInput)"
          />
          <span>.</span>
          <input
            #validFromYearInput
            pInputText
            formControlName="year"
            pKeyFilter="pint"
            inputmode="numeric"
            autocomplete="off"
            maxlength="4"
            class="w-20 text-center"
            placeholder="jjjj"
          />
        </div>
      </div>

      <div class="grid grid-cols-[200px_1fr] items-center gap-x-4">
        <label for="validTo" class="text-right font-medium">Gültig bis</label>
        <div class="flex items-center gap-1" formGroupName="validTo">
          <input
            pInputText
            id="validTo"
            formControlName="day"
            pKeyFilter="pint"
            inputmode="numeric"
            autocomplete="off"
            maxlength="2"
            class="w-12 text-center"
            placeholder="tt"
            (input)="focusNextOnFilled($event, validToMonthInput)"
          />
          <span>.</span>
          <input
            #validToMonthInput
            pInputText
            formControlName="month"
            pKeyFilter="pint"
            inputmode="numeric"
            autocomplete="off"
            maxlength="2"
            class="w-12 text-center"
            placeholder="mm"
            (input)="focusNextOnFilled($event, validToYearInput)"
          />
          <span>.</span>
          <input
            #validToYearInput
            pInputText
            formControlName="year"
            pKeyFilter="pint"
            inputmode="numeric"
            autocomplete="off"
            maxlength="4"
            class="w-20 text-center"
            placeholder="jjjj"
          />
        </div>
      </div>
    </div>

    <div class="flex gap-3 mt-8 justify-end">
      <p-button label="Abbrechen" severity="secondary" type="button" (onClick)="cancel()" />
      <p-button label="Speichern" type="submit" [disabled]="form.invalid" />
    </div>
  </form>
</div>
