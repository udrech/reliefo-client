<div class="flex h-screen">
  <!-- Sidebar -->
  <nav
    class="flex flex-col bg-slate-800 text-white transition-all duration-300 overflow-hidden shrink-0"
    [class.w-56]="!sidebarMinimized()"
    [class.w-14]="sidebarMinimized()"
    aria-label="Hauptnavigation"
  >
    <div class="mt-10"></div>
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        [title]="item.label"
        class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 transition-colors whitespace-nowrap"
      >
        <span class="material-symbols-outlined shrink-0" aria-hidden="true">{{ item.icon }}</span>
        @if (!sidebarMinimized()) {
          <span>{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Right side: header + content -->
  <div class="flex flex-col flex-1 overflow-hidden">
    <!-- Top Bar -->
    <header class="flex items-center h-14 px-4 bg-slate-900 text-white shadow-md shrink-0 z-10">
      <button
        (click)="toggleSidebar()"
        class="p-2 rounded hover:bg-white/10 transition-colors"
        aria-label="Seitenleiste umschalten"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>
      <span class="ml-4 text-lg font-semibold">Reliefo</span>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
