<div class="flex h-screen bg-background text-content">
  <!-- Sidebar -->
  <nav
    class="flex flex-col bg-surface text-content transition-all duration-300 overflow-hidden shrink-0 border-r border-surface"
    [class.w-56]="!sidebarMinimized()"
    [class.w-14]="sidebarMinimized()"
    aria-label="Hauptnavigation"
  >
    <div class="mt-12"></div>
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [title]="item.label"
        class="flex items-center gap-3 px-4 py-5 hover:bg-primary-100 hover:text-primary-800 transition-colors whitespace-nowrap"
        [class.bg-primary-100]="rla.isActive"
        [class.text-primary-800]="rla.isActive"
      >
        <span class="material-symbols-outlined shrink-0" aria-hidden="true">{{ item.icon }}</span>
        @if (!sidebarMinimized()) {
          <span>{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Right side: header + content -->
  <div class="flex flex-col flex-1 overflow-hidden">
    <!-- Top Bar -->
    <header class="flex items-center h-14 px-4 bg-primary-500 text-white shadow-md shrink-0 z-10">
      <button
        (click)="toggleSidebar()"
        class="p-2 rounded hover:bg-black/10 transition-colors"
        aria-label="Seitenleiste umschalten"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>
      <span class="ml-4 text-lg font-semibold">Reliefo</span>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-6 bg-background">
      <router-outlet />
    </main>
    <p-confirmdialog />
    <p-toast position="bottom-center" />
  </div>
</div>
